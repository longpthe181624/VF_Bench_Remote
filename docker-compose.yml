services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: bench-mqtt
    ports:
      # 0.0.0.0 cho phep may khac trong mang ket noi vao, khong chi localhost
      - "0.0.0.0:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    restart: unless-stopped

  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bench-sql
    environment:
      ACCEPT_EULA: "Y"
      # Phai trung voi ConnectionStrings:Default trong appsettings.json.
      # SQL Server tu choi mat khau yeu va container se chet ngay khi khoi dong.
      # Mật khẩu lấy từ .env, KHÔNG để trong file này vì file này nằm trong git.
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:?thiếu SQL_SA_PASSWORD trong .env}"
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:14330:1433"
    volumes:
      - sql-data:/var/opt/mssql
    restart: unless-stopped
    # SQL Server can ~2GB RAM. Neu Docker Desktop cap it hon, container se
    # khoi dong roi tat ngay - xem log bang: docker logs bench-sql
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/1433' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bench-api
    # Chờ SQL thật sự nhận kết nối rồi mới bật backend. Không có cái này thì
    # backend lên trước, EnsureCreatedAsync() gọi vào một SQL chưa sẵn sàng và
    # chết ngay lần khởi động đầu — mà SQL Server mất tới ~90 giây mới lên.
    depends_on:
      sql:
        condition: service_healthy
      mqtt:
        condition: service_started
    environment:
      # Giữ Development để có Swagger ở /swagger. LƯU Ý: môi trường này cũng
      # chạy DevSeed, tức tự đăng ký 5 bench giả lập của bench_simulator.py.
      # Không muốn chúng trong danh mục thì đổi thành Production.
      ASPNETCORE_ENVIRONMENT: Development
      # Trong mạng của compose thì gọi nhau bằng TÊN SERVICE và CỔNG NỘI BỘ.
      # Không phải 127.0.0.1,14330 — 14330 là cổng publish ra host, container
      # này không dùng tới. Quy tắc "luôn dùng 127.0.0.1" trong CLAUDE.md chỉ
      # đúng cho chiều host gọi vào container.
      ConnectionStrings__Default: "Server=sql,1433;Database=BenchConsole;User Id=sa;Password=${SQL_SA_PASSWORD:?thiếu SQL_SA_PASSWORD trong .env};TrustServerCertificate=True;Encrypt=True"
      Mqtt__Host: mqtt
      Mqtt__Port: "1883"
      # Địa chỉ máy bench dùng để tải gói test case về. Khai ở đây thay vì chỉ
      # để trong appsettings.json, vì appsettings bị nướng vào ảnh Docker —
      # mang ảnh sang máy khác là agent tải sai chỗ. Dùng tên MagicDNS chứ
      # không phải IP thô, để đổi IP Tailscale không phải sửa lại.
      GoiTestCase__BaseUrlChoAgent: "${BENCH_BASE_URL:-http://vinfast.tail1cbef5.ts.net:5000}"

      # Khoá ký JWT. Không đặt thì backend tự sinh ngẫu nhiên mỗi lần khởi
      # động, tức là mọi người đang đăng nhập đều bị đăng xuất sau mỗi lần
      # dựng lại container.
      Jwt__Key: "${JWT_KEY:-}"

      # Tài khoản quản trị đầu tiên. Chỉ dùng khi database chưa có người dùng
      # nào; không đặt thì backend sinh mật khẩu ngẫu nhiên và in log MỘT LẦN.
      Auth__AdminEmail: "${ADMIN_EMAIL:-}"
      Auth__AdminPassword: "${ADMIN_PASSWORD:-}"
    ports:
      # Địa chỉ trói cổng 5000, đặt qua biến API_BIND trong file .env.
      # Mặc định `127.0.0.1` = chỉ chính máy A gọi được.
      #
      # Backend hiện KHÔNG có xác thực — `issuedBy` và `by` là tham số người
      # gọi tự khai. Nên chọn địa chỉ trói là chọn ai được ra lệnh chạy test:
      #
      #   127.0.0.1        chỉ máy A                      (mặc định, an toàn nhất)
      #   100.69.35.102    mọi máy trong tailnet          ← nên dùng
      #   0.0.0.0          cả mạng công ty lẫn tailnet    (đừng, khi chưa có đăng nhập)
      #
      # Trói vào ĐÚNG địa chỉ Tailscale là chỗ đứng hợp lý lúc này: bench và
      # người cần dùng đều đã ở trong tailnet, còn mạng công ty thì không với
      # tới. Xem docs/api.md mục 9 — xác thực vẫn là điều kiện để đi xa hơn.
      - "${API_BIND:-127.0.0.1}:5000:8080"
    volumes:
      # /app/App_Data giữ HAI thứ người dùng gửi lên: gói test case trong
      # goi-test-case/ và file kết quả bench gửi về trong bao-cao/. Không gắn
      # volume thì dựng lại container là mất sạch cả hai, TRONG KHI bảng
      # GoiTestCases và BaoCaoChays vẫn còn nguyên dòng nhờ volume sql-data.
      # Console sẽ liệt kê gói và báo cáo mà tải về không có file.
      - goi-data:/app/App_Data
    restart: unless-stopped

volumes:
  mqtt-data:
  sql-data:
  goi-data:
