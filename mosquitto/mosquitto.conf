# Cau hinh cho moi truong DEV.
# Khong TLS, khong mat khau — chi dung trong mang noi bo khi phat trien.
# KHONG dung cau hinh nay cho moi truong that.

# 0.0.0.0 = nhan ket noi tu moi card mang, khong chi localhost.
# Bat buoc phai co neu may khac trong mang can ket noi vao.
listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type notice

# Muon them mat khau thi bo comment hai dong duoi va chay:
#   docker compose exec mqtt mosquitto_passwd -c -b /mosquitto/config/passwd bench-sim <mat-khau>
# allow_anonymous false
# password_file /mosquitto/config/passwd
